name: "Copilot Setup Steps"

# Prepares the Copilot cloud agent's environment before the agent starts.
# Runs outside the agent firewall, so dependency installs reach the registry.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: node/frontend/package-lock.json
      - name: Install Node frontend dependencies
        working-directory: node/frontend
        run: npm ci
